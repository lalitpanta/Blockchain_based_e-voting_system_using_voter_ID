<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter List Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
            text-align: left;
        }
        .search-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .search-bar {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .search-button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .search-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Voter List Search</h2>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-bar" placeholder="Enter Voter ID..." />
        <button class="search-button" onclick="searchFunction()">Search</button>
    </div>

    <section id="voterListSection">
        <table id="voterTable">
            <tr>
                <th>Citizenship Number</th>
                <th>Full Name</th>
                <th>Date Of Birth</th>
                <th>Gender</th>
                <th>Membership Number</th>
                <th>Voter Id Number</th>
                <th>Voter Id Issued Date</th>
                <th>Voter Id Issued By</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Document</th>
            </tr>
            <tbody id="voterData"></tbody>
        </table>
    </section>

    <script>
        function searchFunction() {
            const voterId = document.getElementById('search-bar').value;

            if (!voterId) {
                alert("Please enter a Voter ID to search.");
                return;
            }

            fetch(`http://localhost:3000/getVoterById/${voterId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const voterDataContainer = document.getElementById('voterData');
                    voterDataContainer.innerHTML = ""; // Clear previous results

                    if (data.info) {
                        const info = data.info;
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${info.citizenship_no}</td>
                            <td>${info.name}</td>
                            <td>${info.dob}</td>
                            <td>${info.gender}</td>
                            <td>${info.nea_membership_no}</td>
                            <td>${info.voter_id}</td>
                            <td>${info.issued_date}</td>
                            <td>${info.issued_name}</td>
                            <td>${info.contact}</td>
                            <td>${info.email}</td>
                            <td>
                                <button 
                                    style="background-color: #007bff; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease;"
                                    onclick="printVoter('${info.voter_id}')">Print
                                </button>
                            </td>
                        `;
                        voterDataContainer.appendChild(row);
                    } else {
                        alert("No voter found with the given Voter ID.");
                    }
                })
                .catch(error => {
                    console.error('There was a problem with your fetch operation:', error);
                });
        }

        function printVoter(voterId) {
            fetch(`http://localhost:3000/voter/${voterId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `voter-${voterId}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                })
                .catch(error => {
                    console.error('There was a problem with fetching the voter information:', error);
                });
        }
    </script>

</body>
</html>
