<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote</title>
  <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
  <script src="/client/src/B_voteCandidate.js"></script>
  <link rel="stylesheet" href="/client/style/B_voteCandidate.css">
</head>
<body>
  <div class="container">
    <div id="timer" class="timer">60</div>
    <div id="message" class="message">Your page will be Automatically Re-Directed After:</div>
    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>
  </div>

  <h1>Vote for a Candidate</h1>
  <form id="voterForm">
    <label for="voterID"> please set your voter Id:</label>
    <input type="number" id="voterID" readonly>
    <button id="setVoterID">Set Voter ID</button>

  </form>
  <p id="status"></p>

  <div id="candidateInfo">
    <h3>Candidate List:</h3>
    <table border="1" id="candidateTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <!-- <th>Party</th> -->
          <th>Position</th>
          <th>Vote Count</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
     
      </tbody>
    </table>
  </div>


<!-- yo le chahi back garna mildaina current page lai -->
  <script>
    history.pushState(null, document.title, location.href);
    window.addEventListener('popstate', function(event) {
      history.pushState(null, document.title, location.href);
    });
  </script>


</body>
</html>
