<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Address Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            max-width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #alreadyCreatedBtn {
            background-color: #28a745;
        }
        #alreadyCreatedBtn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <form id="contractForm">
        <label for="contractAddress">Contract Address:</label>
        <input type="text" id="contractAddress" name="contractAddress" required>

        <label for="startTime">Start Time:</label>
        <input type="datetime-local" id="startTime" name="start_time" required>

        <label for="endingTime">Ending Time:</label>
        <input type="datetime-local" id="endingTime" name="ending_time" required>

        <button type="submit" id="createBtn">Create</button>
        <button type="button" id="alreadyCreatedBtn">Already Created</button>
    </form>

    <script>
        const apiBaseUrl = 'http://localhost:3000/api/contract';

        // Handle form submission for 'Create' button
        document.getElementById('contractForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const contractAddress = document.getElementById('contractAddress').value;
            const startTime = document.getElementById('startTime').value;
            const endingTime = document.getElementById('endingTime').value;

            try {
                const response = await fetch(apiBaseUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        contractAddress,
                        start_time: startTime,
                        ending_time: endingTime
                    }),
                });

                const result = await response.json();
                
                if (response.ok) {
                    // Redirect to B_addcandidate.html after successful form submission
                    window.location.href = '/client/public/B_addcandidate.html';
                } else {
                    alert(result.message || 'Failed to start election');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error saving contract address');
            }
        });

        // Handle 'Already Created' button click
        document.getElementById('alreadyCreatedBtn').addEventListener('click', function() {
            // Redirect to B_addcandidate.html without submitting the form
            window.location.href = '/client/public/B_addcandidate.html';
        });
    </script>
    
</body>
</html>
