<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote</title>
  <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
  <link rel="stylesheet" href="/client/style/B_voteCandidate.css">
</head>
<body>

  <div class="container">
    <div id="timer" class="timer">60</div>
    <div id="message" class="message">Your page will be automatically redirected after:</div>
    <div class="progress-bar">
      <div id="progress" class="progress"></div>
    </div>
  </div>

  <h1>Vote for a Candidate</h1>
  <form id="voterForm">
    <label for="voterID">Enter Your Voter ID:</label>
    <input type="number" id="voterID" readonly>
    <button id="setVoterID" type="button">Set Voter ID</button>
  </form>

  <div id="candidateInfo">
    <h3>Candidate List:</h3>
    <div id="candidates"></div>
  </div>

  <p id="status"></p>



<script>
  
document.addEventListener('DOMContentLoaded', () => {
  const countdownDuration = 60; // Countdown duration in seconds
  const storageKey = "countdownEndTime"; // Key for localStorage
  const timerElement = document.getElementById('timer');
  const progressElement = document.getElementById('progress');

  // Retrieve or initialize the countdown end time
  let countdownEndTime = localStorage.getItem(storageKey);
  if (!countdownEndTime) {
      countdownEndTime = Date.now() + countdownDuration * 1000; // Set new end time
      localStorage.setItem(storageKey, countdownEndTime);
  } else {
      countdownEndTime = parseInt(countdownEndTime, 10); // Ensure it's a number
  }

  // Function to update the timer and progress bar
  const updateTimer = () => {
      const currentTime = Date.now();
      const timeLeft = Math.max(0, Math.floor((countdownEndTime - currentTime) / 1000)); // Calculate remaining time

      // Update the DOM elements
      timerElement.textContent = timeLeft;
      progressElement.style.width = `${(timeLeft / countdownDuration) * 100}%`;

      // Redirect if countdown ends
      if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          localStorage.removeItem(storageKey); // Clear the stored end time
          window.location.href = '/client/public/index.html'; // Redirect to the target page
      }
  };

  // Run the timer every second
  const countdownInterval = setInterval(updateTimer, 1000);

  // Update the timer immediately to avoid delay
  updateTimer();
});























// Function to get the value of a cookie by name
function getCookie(name) {
  const value = `; ${document.cookie}`;
  const parts = value.split(`; ${name}=`);
  if (parts.length === 2) return parts.pop().split(';').shift();
}

// Populate the input field with the ID from the cookie and make it readonly
window.onload = function () {
  const userID = getCookie('userID');
  const inputField = document.getElementById('voterID');

  if (inputField) {
    if (userID) {
      inputField.value = userID;
    } else {
      alert('No ID found. Please login and validate first.');
    }
  } else {
    console.error('Input field with id "voterID" not found.');
  }
};

























let web3;
let votingContract;
let voterID = null; // Store the voter ID after it is set
let contractAddress; // Will be set after fetching from the API

const contractABI = [
  {
    "inputs": [],
    "name": "candidateCount",
    "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
    "stateMutability": "view",
    "type": "function"
  },
  {
    "inputs": [{ "internalType": "uint256", "name": "candidateId", "type": "uint256" }],
    "name": "getCandidate",
    "outputs": [
      { "internalType": "string", "name": "name", "type": "string" },
      { "internalType": "string", "name": "party", "type": "string" },
      { "internalType": "string", "name": "position", "type": "string" },
      { "internalType": "uint256", "name": "voteCount", "type": "uint256" }
    ],
    "stateMutability": "view",
    "type": "function"
  },
  {
    "inputs": [
      { "internalType": "uint256", "name": "voterID", "type": "uint256" },
      { "internalType": "uint256", "name": "candidateId", "type": "uint256" }
    ],
    "name": "vote",
    "outputs": [{ "internalType": "bool", "name": "success", "type": "bool" }],
    "stateMutability": "nonpayable",
    "type": "function"
  },
  {
    "inputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
    "name": "registeredVoters",
    "outputs": [{ "internalType": "bool", "name": "", "type": "bool" }],
    "stateMutability": "view",
    "type": "function"
  }
];

// Fetch the contract address from the server
async function fetchContractAddress() {
  try {
    const response = await fetch('http://localhost:3000/api/contract');

    if (!response.ok) {
      throw new Error(`HTTP error! Status: ${response.status}`);
    }

    const data = await response.json();
    contractAddress = data.contractAddress;

    if (!contractAddress || contractAddress === 'No address found') {
      throw new Error('Contract address not found');
    }

    await initWeb3(); // Initialize Web3 after fetching the contract address
  } catch (error) {
    console.error('Error fetching contract address:', error.message);
    alert('Failed to fetch contract address. Please try again later.');
  }
}

// Initialize Web3
async function initWeb3() {
  if (window.ethereum) {
    try {
      web3 = new Web3(window.ethereum);
      await window.ethereum.request({ method: "eth_requestAccounts" });
      votingContract = new web3.eth.Contract(contractABI, contractAddress);
      await loadCandidates(); // Load candidates after initializing Web3
    } catch (error) {
      console.error('Error initializing Web3:', error.message);
      alert('Failed to connect to MetaMask. Please try again.');
    }
  } else {
    alert("MetaMask is not installed. Please install MetaMask to use this application.");
  }
}

// Load candidates and display them grouped by party
async function loadCandidates() {
  try {
    const candidateCount = await votingContract.methods.candidateCount().call();
    const candidateContainer = document.getElementById("candidates");

    // Map parties to their candidates
    const partyMap = {};

    for (let i = 0; i < candidateCount; i++) {
      const candidate = await votingContract.methods.getCandidate(i).call();
      const party = candidate.party;

      if (!partyMap[party]) {
        partyMap[party] = [];
      }
      partyMap[party].push({ id: i, ...candidate });
    }

    candidateContainer.innerHTML = "";

    // Create a table for displaying candidates
    const table = document.createElement("table");
    table.border = "1";
    table.style.width = "100%";

    // Table headers
    const headerRow = document.createElement("tr");
    headerRow.innerHTML = `<th>Party</th><th>Candidates</th>`;
    table.appendChild(headerRow);

    // Populate the table with candidates
    for (const party in partyMap) {
      const row = document.createElement("tr");

      // Party column
      const partyCell = document.createElement("td");
      partyCell.textContent = party;
      row.appendChild(partyCell);

      // Candidates column
      const candidatesCell = document.createElement("td");
      candidatesCell.style.whiteSpace = "nowrap";

      partyMap[party].forEach(candidate => {
        const candidateElement = document.createElement("div");
        candidateElement.style.display = "inline-block";
        candidateElement.style.margin = "0 20px";

        candidateElement.innerHTML = `
          <p>Name: <strong>${candidate.name}</strong></p>
          <p>Position: ${candidate.position}</p>
          <p>Votes: ${candidate.voteCount}</p>
          <button onclick="vote(${candidate.id})">Vote</button>
        `;
        candidatesCell.appendChild(candidateElement);
      });

      row.appendChild(candidatesCell);
      table.appendChild(row);
    }

    candidateContainer.appendChild(table);
  } catch (error) {
    console.error("Error fetching candidates:", error);
  }
}

const predefinedAccount = "0xDFB4b6c361F5FE50318eD25CAA320D8C98A55bc4"; // Your Ganache account address

// Function to cast a vote
async function vote(candidateId) {
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });

    await votingContract.methods.vote(voterID, candidateId).send({ from: predefinedAccount });

    alert(`Vote cast successfully for candidate ID: ${candidateId}`);
    await loadCandidates(); // Refresh candidates after voting
  } catch (error) {
    console.error("Error casting vote:", error);
    alert("Failed to cast vote. User may have already voted or there was an issue.");
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  await fetchContractAddress();
});







</script>




</body>

</html>
