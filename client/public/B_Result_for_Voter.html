<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate List</title>
  <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
  <script src="/client/src/B_Result_blockchain.js"></script>
  <link rel="stylesheet" href="/client/style/B_result.css">
  
</head>
<body>


  
   

  <div class="container">
    <h1>Current Result of Election</h1>
    <button type="button" onClick="window.location.reload()">Refresh!</button>
  



    <br>
    <br>
    <iframe src="/client/public/B_totalVoteCount.html" width="250px" height="210px"></iframe>
    <br>
    <br>
    <br>





    <button type="button" onclick="storeFinalResult()" id="btn">Store Final Result on Database</button>
    <div id="message"></div>
 



    <div id="candidateContainer">
     
    </div>
  </div>
<script>


async function storeFinalResult() {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = 'Storing final result...';

      try {
        // Making the API call to fetch and store candidates in the database
        const response = await fetch('http://localhost:3000/fetchCandidates', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          },
        });

        if (response.ok) {
          const result = await response.json();
          messageDiv.textContent = result.message || 'Candidates fetched and stored successfully!';
        } else {
          const errorResult = await response.json();
          messageDiv.textContent = errorResult.message || 'Failed to fetch candidates.';
        }
      } catch (error) {
        console.error('Error:', error);
        messageDiv.textContent = 'An error occurred while storing the final result.';
      }
    }


</script>
  </body>
</html>
